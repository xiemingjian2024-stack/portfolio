<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FunnFuzzy 图标候选</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 64px; color: #000; background: #fff; font-family: Inter, system-ui, sans-serif; }
      h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: 0; }
      p { max-width: 680px; margin: 0 0 48px; color: #555; font-size: 16px; line-height: 1.5; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
      figure { display: grid; min-height: 280px; margin: 0; padding: 48px; place-items: center; background: #f3f3f0; border-radius: 8px; }
      img { width: 88px; height: 88px; }
      figcaption { margin-top: 28px; font-size: 14px; }
      @media (max-width: 720px) {
        body { padding: 24px 12px; }
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        figure { min-height: 200px; padding: 28px 16px; }
        img { width: 64px; height: 64px; }
      }
    </style>
  </head>
  <body>
    <h1>图标候选</h1>
    <p>独立候选集，尚未加入正式图标库。统一采用 48×48dp 基准、3dp 线宽与直角端点。</p>
    <main class="grid">
      <figure><div><img src="/assets/app-icon-guide/candidates/camera.svg" alt="相机" /><figcaption>相机</figcaption></div></figure>
      <figure><div><img src="/assets/app-icon-guide/candidates/calendar.svg" alt="日历" /><figcaption>日历</figcaption></div></figure>
      <figure><div><img src="/assets/app-icon-guide/candidates/share.svg" alt="分享" /><figcaption>分享</figcaption></div></figure>
      <figure><div><img src="/assets/app-icon-guide/candidates/download.svg" alt="下载" /><figcaption>下载</figcaption></div></figure>
      <figure><div><img src="/assets/app-icon-guide/candidates/hidden.svg" alt="隐藏" /><figcaption>隐藏</figcaption></div></figure>
      <figure><div><img src="/assets/app-icon-guide/candidates/lock.svg" alt="锁定" /><figcaption>锁定</figcaption></div></figure>
    </main>
  </body>
</html>
